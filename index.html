<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Proyecto de Realidad Virtual</title>

    <!-- ========================= -->
    <!-- A-FRAME -->
    <!-- ========================= -->

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>


    <!-- ========================= -->
    <!-- CSS -->
    <!-- ========================= -->

    <link rel="stylesheet" href="css/estilos.css">

</head>


<body>

    <!-- ========================= -->
    <!-- MENÚ PRINCIPAL -->
    <!-- ========================= -->

    <div id="menu-principal">

    <div class="menu-contenido">

        <h1>RECORRIDO VIRTUAL</h1>

        <p>
            Experiencia interactiva
        </p>

        <p class="texto-seleccion">
            Selecciona un recorrido
        </p>

        <div id="menu-recorridos">

            <button data-recorrido-menu="1">
                RECORRIDO 1
            </button>

            <button data-recorrido-menu="2">
                RECORRIDO 2
            </button>

            <button data-recorrido-menu="3">
                RECORRIDO 3
            </button>

            <button data-recorrido-menu="4">
                RECORRIDO 4
            </button>

            <button data-recorrido-menu="5">
                RECORRIDO 5
            </button>

            <button data-recorrido-menu="6">
                RECORRIDO 6
            </button>

        </div>

        <button id="btn-iniciar">
            INICIAR EXPERIENCIA
        </button>

        <button id="btn-informacion">
            INFORMACIÓN
        </button>

    </div>

</div>


    <!-- ========================= -->
    <!-- ESCENA DE REALIDAD VIRTUAL -->
    <!-- ========================= -->

    <a-scene id="escena-vr">


        <!-- ========================= -->
        <!-- CONTROLES DEL RECORRIDO -->
        <!-- ========================= -->

        <div id="controles-recorrido">

            <button id="btn-anterior">
                ← ANTERIOR
            </button>

            <div id="estado-recorrido">

                <span id="nombre-recorrido">
                    RECORRIDO 1
                </span>

                <span id="contador-imagen">
                    Imagen 1 / 5
                </span>

            </div>

            <button id="btn-siguiente">
                SIGUIENTE →
            </button>

        </div>


        <!-- ========================= -->
        <!-- SELECTOR DE RECORRIDOS -->
        <!-- ========================= -->

        <div id="selector-recorridos">

            <button data-recorrido="1">
                RECORRIDO 1
            </button>

            <button data-recorrido="2">
                RECORRIDO 2
            </button>

            <button data-recorrido="3">
                RECORRIDO 3
            </button>

            <button data-recorrido="4">
                RECORRIDO 4
            </button>

            <button data-recorrido="5">
                RECORRIDO 5
            </button>

            <button data-recorrido="6">
                RECORRIDO 6
            </button>

        </div>


        <!-- ========================= -->
        <!-- PANEL DE INFORMACIÓN -->
        <!-- ========================= -->

        <div id="panel-informacion">

            <h2 id="titulo-imagen">
                Ed1.1
            </h2>

            <p id="descripcion-imagen">
                Información de esta ubicación.
            </p>

            <button id="btn-cerrar-info">
                CERRAR
            </button>

        </div>


        <!-- ========================= -->
        <!-- ILUMINACIÓN -->
        <!-- ========================= -->

        <a-light
            type="ambient"
            color="#ffffff"
            intensity="1">
        </a-light>

        <a-light
            type="point"
            position="0 4 0"
            intensity="2"
            distance="15">
        </a-light>


        <!-- ========================= -->
        <!-- FONDO -->
        <!-- ========================= -->

        <a-sky
            color="#101820">
        </a-sky>


        <!-- ========================= -->
        <!-- PISO -->
        <!-- ========================= -->

        <a-plane
            position="0 0 0"
            rotation="-90 0 0"
            width="20"
            height="20"
            color="#30343b">
        </a-plane>


        <!-- ========================= -->
        <!-- PARED TRASERA -->
        <!-- ========================= -->

        <a-box
            position="0 3 -8"
            width="20"
            height="6"
            depth="0.2"
            color="#20262d">
        </a-box>


        <!-- ========================= -->
        <!-- PARED IZQUIERDA -->
        <!-- ========================= -->

        <a-box
            position="-10 3 0"
            width="0.2"
            height="6"
            depth="16"
            color="#252b32">
        </a-box>


        <!-- ========================= -->
        <!-- PARED DERECHA -->
        <!-- ========================= -->

        <a-box
            position="10 3 0"
            width="0.2"
            height="6"
            depth="16"
            color="#252b32">
        </a-box>


        <!-- ========================= -->
        <!-- PARED DELANTERA -->
        <!-- ========================= -->

        <a-box
            position="0 3 8"
            width="20"
            height="6"
            depth="0.2"
            color="#20262d">
        </a-box>


        <!-- ========================= -->
        <!-- TECHO -->
        <!-- ========================= -->

        <a-plane
            position="0 6 0"
            rotation="90 0 0"
            width="20"
            height="16"
            color="#15191e">
        </a-plane>


        <!-- ========================= -->
        <!-- TÍTULO DE LA ESCENA -->
        <!-- ========================= -->

        <a-text
            value="PROYECTO DE REALIDAD VIRTUAL"
            position="-4 4 -7.8"
            color="#ffffff"
            width="8"
            align="center">
        </a-text>


        <!-- ========================= -->
        <!-- IMAGEN DEL RECORRIDO -->
        <!-- ========================= -->

        <a-image
            id="imagen-recorrido"
            position="0 2.5 -7.7"
            width="5.33"
            height="4">
        </a-image>


        <!-- ========================= -->
        <!-- CÁMARA -->
        <!-- ========================= -->

        <a-camera
            position="0 1.6 5"
            look-controls="enabled: true"
            wasd-controls="enabled: true">

            <a-cursor
                color="#FFFFFF">
            </a-cursor>

        </a-camera>


        <!-- ========================= -->
        <!-- BOTÓN ANTERIOR VR -->
        <!-- ========================= -->

        <a-box
            id="btn-vr-anterior"
            position="-3 0.8 -4.5"
            width="1.2"
            height="0.6"
            depth="0.2"
            color="#1677ff">

            <a-text
                value="◀"
                align="center"
                position="0 0 0.12"
                width="4"
                color="#ffffff">
            </a-text>

        </a-box>


        <!-- ========================= -->
        <!-- BOTÓN SIGUIENTE VR -->
        <!-- ========================= -->

        <a-box
            id="btn-vr-siguiente"
            position="3 0.8 -4.5"
            width="1.2"
            height="0.6"
            depth="0.2"
            color="#1677ff">

            <a-text
                value="▶"
                align="center"
                position="0 0 0.12"
                width="4"
                color="#ffffff">
            </a-text>

        </a-box>


        <!-- ========================= -->
        <!-- TEXTO DEL RECORRIDO -->
        <!-- ========================= -->

        <a-text
            id="texto-recorrido-vr"
            value="Recorrido 1 • Imagen 1 / 5"
            position="0 0.8 -4.5"
            align="center"
            width="5"
            color="#ffffff">
        </a-text>

        <!-- PUNTO DE AVANCE -->

        <a-entity
            id="punto-avance"
            position="0 0.8 -4">

        <a-circle
            radius="0.35"
            color="#1677ff"
            rotation="-90 0 0">
        </a-circle>

        <a-text
            value="AVANZAR"
            position="0 0.05 0"
            rotation="-90 0 0"
            align="center"
            width="2"
            color="#ffffff">
        </a-text>

</a-entity>


    </a-scene>


    <!-- ========================= -->
    <!-- JAVASCRIPT -->
    <!-- ========================= -->

    <script src="js/app.js"></script>


</body>

</html>
